# OTA to the `production` update branch, bundled on EAS servers.
#
# Why a workflow and not `eas update` on the laptop (Yoav 11.10.26): Windows
# Smart App Control (enforce mode) blocks node_modules/hermes-compiler/.../
# hermesc.exe, so every local export dies with "spawn UNKNOWN" at the Hermes
# step. The cloud runner has its own hermesc. EXPO_PUBLIC_* come from the EAS
# `production` environment (aligned 19.9 — see docs/DECISION-LOG), never from
# a local .env file.
#
# Two jobs, one per native platform, on purpose: `platform: all` also exports
# WEB, and the web bundle pulls app/api/** routes whose server-only imports
# (src/db/schema) are export-ignored from the archive → "Unable to resolve
# module". Native bundles never include API routes.
#
# Run from a clean checkout (needs a git repo in that folder):
#   eas workflow:run .eas/workflows/ota-production.yml --non-interactive --wait -F message="..."
name: OTA production

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        default: "OTA"

jobs:
  update_android:
    name: Publish update (Android)
    type: update
    environment: production
    params:
      branch: production
      platform: android
      message: ${{ inputs.message }}
  update_ios:
    name: Publish update (iOS)
    type: update
    environment: production
    params:
      branch: production
      platform: ios
      message: ${{ inputs.message }}
